[package]
name = "encryptex-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.5.3", features = ["rand", "password-hash", "std"] }
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
futures-util = "0.3.33"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx =  { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "v7", "serde"] }
